# Upstream dependency name -> Spack package.
#
# Loaded directly by the map_dependencies skill (not indexed for text search).
# Extend freely: this table is the first thing the mapper consults, before any
# trained model or guess.
#
# An entry is either a Spack package name, or a mapping with:
#   spack:      package or virtual name; null means "no Spack dependency needed"
#   virtual:    true for virtual packages (mpi, blas, lapack, zlib-api, ...)
#   type:       dependency types if not the default [build, link]
#   components: upstream component -> variant string appended to the spec
#   component_template: applied to components not listed, "{component}" is lower-cased
#   note:       guidance surfaced to the agent and as a recipe comment
#
# Names and virtuals reflect Spack 1.x conventions; verify against `spack list` /
# `spack providers` on the target installation.

cmake:                      # find_package(), Autoconf lookup macros, program names
  MPI: {spack: mpi, virtual: true}
  OpenMP: {spack: null, note: "OpenMP comes from the compiler; no depends_on needed. With apple-clang add depends_on('llvm-openmp', when='%apple-clang')."}
  Threads: {spack: null}
  CUDA: {spack: cuda, note: "Prefer inheriting from CudaPackage (adds +cuda and cuda_arch variants)."}
  CUDAToolkit: {spack: cuda, note: "Prefer inheriting from CudaPackage (adds +cuda and cuda_arch variants)."}
  HIP: {spack: hip, note: "Prefer inheriting from ROCmPackage (adds +rocm and amdgpu_target)."}
  OpenACC: {spack: null, note: "OpenACC is a compiler feature (nvhpc, gcc with offload)."}
  BLAS: {spack: blas, virtual: true}
  LAPACK: {spack: lapack, virtual: true}
  ScaLAPACK: {spack: scalapack, virtual: true}
  HDF5:
    spack: hdf5
    components: {HL: "+hl", Fortran: "+fortran", Fortran_HL: "+fortran+hl", CXX: "+cxx", C: ""}
    note: "If the project uses parallel HDF5 (H5Pset_fapl_mpio), require hdf5+mpi."
  NetCDF: netcdf-c
  netCDF: netcdf-c
  NetCDF-Fortran: netcdf-fortran
  PnetCDF: parallel-netcdf
  ADIOS2: adios2
  Boost: {spack: boost, component_template: "+{component}"}
  Eigen3: eigen
  FFTW3: {spack: fftw-api, virtual: true}
  FFTW: {spack: fftw-api, virtual: true}
  GSL: gsl
  ZLIB: {spack: zlib-api, virtual: true}
